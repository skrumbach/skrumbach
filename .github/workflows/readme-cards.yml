name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test renderer
        run: npm test

      # Each source falls back to the last committed snapshot, so a homelab outage
      # never breaks the profile; it just shows "last seen".
      - name: Fetch GitHub + homelab data
        run: npm run fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KROMGO_URL: ${{ secrets.KROMGO_URL }}

      - name: Render profile.svg
        run: npm run render

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/profile.svg data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(profile): refresh stats"
          git push
