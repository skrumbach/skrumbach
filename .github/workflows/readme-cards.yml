name: Update README cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&bg_color=060818&title_color=22D8F0&icon_color=D946E6&text_color=CDD2E6&border_color=3B2E7A
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=060818&title_color=22D8F0&text_color=CDD2E6&border_color=3B2E7A
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin home-ops
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=home-ops&bg_color=060818&title_color=22D8F0&icon_color=A57BFF&text_color=CDD2E6&border_color=3B2E7A
          path: profile/pin-home-ops.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin mortyops
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=mortyops&bg_color=060818&title_color=22D8F0&icon_color=A57BFF&text_color=CDD2E6&border_color=3B2E7A
          path: profile/pin-mortyops.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
