<!doctype html>
<!-- Local preview of the README as GitHub renders it (dark theme). Open in a browser.
     ?src=build/profile.sample.svg previews the fixture render from `npm run sample`. -->
<meta charset="utf-8"><title>README preview</title>
<style>
  body { margin: 0; background: #0d1117; font: 14px -apple-system, "Segoe UI", sans-serif; color: #7d8590; }
  .frame { max-width: 846px; margin: 24px auto; padding: 24px; border: 1px solid #30363d; border-radius: 6px; }
  .crumb { font: 12px ui-monospace, monospace; margin-bottom: 16px; }
  p { margin: 0 0 16px; text-align: center; } img { max-width: 100%; }
</style>
<div class="frame"><div class="crumb">skrumbach / README.md</div>
  <p><img id="profile" src="profile/profile.svg" width="100%" alt="profile"></p>
  <p><img src="assets/btn-linkedin.svg" alt="LinkedIn"> <img src="assets/btn-github.svg" alt="GitHub"> <img src="assets/btn-web.svg" alt="skrumbach.com"></p>
</div>
<script>const s = new URLSearchParams(location.search).get('src'); if (s) document.getElementById('profile').src = s;</script>
